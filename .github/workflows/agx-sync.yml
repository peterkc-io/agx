# The upstream push uses AGX_SYNC_TOKEN, a fine-grained token with
# Contents and Workflows write on this repository only: GITHUB_TOKEN cannot
# push commits that change .github/workflows/. It is a secret of the
# agx-sync environment, so only the sync job can read it, and sync.py passes
# it only to that one git push. Every other write uses GITHUB_TOKEN.
name: agx-sync

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write
  actions: write

concurrency:
  group: agx-sync
  cancel-in-progress: false

env:
  AGX_SYNC_SCHEDULE: ${{ vars.AGX_SYNC_SCHEDULE }}
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    # Refuse a disabled schedule before the job enters the environment, which
    # would record a deployment. sync.py repeats the check for direct runs.
    if: github.event_name != 'schedule' || vars.AGX_SYNC_SCHEDULE == 'on'
    runs-on: ubuntu-24.04
    environment: agx-sync
    outputs:
      head: ${{ steps.sync.outputs.head }}
      run-gates: ${{ steps.sync.outputs.run-gates }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the upstream sync
        id: sync
        env:
          AGX_SYNC_TOKEN: ${{ secrets.AGX_SYNC_TOKEN }}
        run: python3 scripts/agx/sync.py

  gates:
    needs: sync
    if: needs.sync.outputs.run-gates == 'true'
    uses: ./.github/workflows/agx-ci.yml
    with:
      merge-upstream: ${{ needs.sync.outputs.head }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      BUILDBUDDY_API_KEY_RO: ${{ secrets.BUILDBUDDY_API_KEY_RO }}

  status:
    needs: [sync, gates]
    if: always() && needs.sync.result == 'success' && needs.sync.outputs.run-gates == 'true' && needs.gates.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Post the sync check result
        env:
          SYNC_HEAD: ${{ needs.sync.outputs.head }}
          SYNC_STATE: ${{ needs.gates.result == 'success' && 'success' || 'failure' }}
        run: python3 scripts/agx/sync.py --post-status "$SYNC_STATE" --head "$SYNC_HEAD"
